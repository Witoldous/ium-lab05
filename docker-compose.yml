# Lab 5: pipeline ML z lab. 3 (train) + serwer HTTP z wynikami (visualize)
services:
  train:
    build: .                        # Dockerfile z zadania 1
    image: ium-lab05-train
    init: true                      # tini jako PID 1: szybkie zatrzymanie po SIGTERM
    command: ["python", "src/pipeline.py"]   # wszystkie etapy zamiast samego train.py
    env_file: .env.train            # hiperparametry i ścieżki tylko dla tej usługi
    environment:
      - N_JOBS=2                    # nadpisuje wartość z .env.train
    expose:
      - "5000"                      # /status tylko w sieci compose, bez portu na hoście
    volumes:
      - ./models:/app/models        # model i wyniki zostają na hoście
      - ./data:/app/data:ro         # dane tylko do odczytu
    mem_limit: 512m                 # zadanie 4: limit pamięci
    cpus: 1.5                       # i maks. 1,5 rdzenia

  visualize:
    build: ./visualize
    image: ium-lab05-visualize
    init: true
    env_file: .env.visualize        # osobna konfiguracja (adres train, katalog wyników)
    ports:
      - "8080:8080"                 # jedyny port wystawiony na hosta
    volumes:
      - ./models:/srv/models:ro     # ten sam katalog co w train, tylko odczyt
    depends_on:
      - train                       # start dopiero po uruchomieniu kontenera train
